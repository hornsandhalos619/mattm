[Rainmeter]
Update=16
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=HALOS Taskbar
Author=Cathedral of Flesh & Iron
Version=1.0
License=MIT

@Include=#@#Variables.inc

; ─── ANIMATION MEASURES ───
[MeasureBreath]
Measure=Script
ScriptFile=#@#Animations.lua
UpdateDivider=1
BreathDuration=4000
PulseDuration=2000

[MeasureTime]
Measure=Time
Format=%H:%M:%S

; ─── BACKGROUND - Gothic Taskbar ───
[MeterTaskbarBg]
Meter=Shape
Shape=Rectangle 0,0,#SCREENAREAWIDTH#,#TaskbarHeight#,0 | Fill LinearGradient TaskbarGrad | StrokeWidth 2 | Stroke Color #ColorBorder#
TaskbarGrad=180 | #ColorBgElevated# ; 0.0 | #ColorBg# ; 0.5 | #ColorBgElevated# ; 1.0
DynamicVariables=1

; Gothic segments (animated)
[MeterVertebrae]
Meter=Shape
X=0
Y=0
Shape=Path VertebraePath | Fill LinearGradient VertGrad | StrokeWidth 0
VertGrad=90 | #ColorAccent#,128 ; 0.0 | #ColorAccentMid#,200 ; 0.5 | #ColorAccent#,128 ; 1.0
DynamicVariables=1
VertebraePath=0,0 | LineTo #SCREENAREAWIDTH#,0 | LineTo #SCREENAREAWIDTH#,#TaskbarHeight# | LineTo 0,#TaskbarHeight# | ClosePath 1

; ─── START BUTTON - Spired Mandala ───
[MeterStartBtn]
Meter=Shape
X=12
Y=([#TaskbarHeight# - #StartSize#] / 2)
Shape=Ellipse #StartSize#/2,#StartSize#/2,#StartSize#/2 | Fill RadialGradient StartGrad | StrokeWidth 2 | Stroke Color #ColorBorder# | Extend StartMods
StartGrad=50%,50% | #ColorBgElevated# ; 0.0 | #ColorBg# ; 0.7
StartMods=Shadow 0,0,8,#ColorGlow#
LeftMouseUpAction=[!ToggleConfig "HALOS\Start" "Start.ini"]
MouseOverAction=[!SetOption MeterStartBtn Shape "Ellipse #StartSize#/2,#StartSize#/2,#StartSize#/2 | Fill RadialGradient StartGrad | StrokeWidth 2 | Stroke Color #ColorGlow# | Extend StartMods"][!UpdateMeter MeterStartBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterStartBtn Shape "Ellipse #StartSize#/2,#StartSize#/2,#StartSize#/2 | Fill RadialGradient StartGrad | StrokeWidth 2 | Stroke Color #ColorBorder# | Extend StartMods"][!UpdateMeter MeterStartBtn][!Redraw]
DynamicVariables=1

; Spired mandala SVG (simplified)
[MeterStartIcon]
Meter=Image
ImageName=#@#Images\horn-mandala.svg
X=([#StartSize# - 36] / 2) + 12
Y=([#TaskbarHeight# - 36] / 2)
W=36
H=36
DynamicVariables=1
ImageTint=#ColorGlow#

; ─── SIGIL LAUNCHERS ───
[MeterMandala1]
Meter=Shape
X=80
Y=([#TaskbarHeight# - 40] / 2)
Shape=Ellipse 20,20,20 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color #ColorBorder# | Extend MandalaMods
MandalaMods=Shadow 0,0,4,#ColorGlow#
LeftMouseUpAction=["notepad.exe"]
MouseOverAction=[!SetOption MeterMandala1 Shape "Ellipse 20,20,20 | Fill Color #ColorAccent#,64 | StrokeWidth 2 | Stroke Color #ColorGlow# | Extend MandalaMods"][!UpdateMeter MeterMandala1][!Redraw]
MouseLeaveAction=[!SetOption MeterMandala1 Shape "Ellipse 20,20,20 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color #ColorBorder# | Extend MandalaMods"][!UpdateMeter MeterMandala1][!Redraw]
DynamicVariables=1

[MeterMandala1Text]
Meter=String
X=100
Y=([#TaskbarHeight#] / 2)
FontFace=#FontMandala#
FontSize=14
FontColor=#ColorGlow#
StringAlign=CenterCenter
Text=☸
AntiAlias=1
DynamicVariables=1

[MeterMandala2]
Meter=Shape
X=140
Y=([#TaskbarHeight# - 40] / 2)
Shape=Ellipse 20,20,20 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color #ColorBorder# | Extend MandalaMods
LeftMouseUpAction=["explorer.exe"]
DynamicVariables=1

[MeterMandala2Text]
Meter=String
X=160
Y=([#TaskbarHeight#] / 2)
FontFace=#FontMandala#
FontSize=14
FontColor=#ColorGlow#
StringAlign=CenterCenter
Text=☸
AntiAlias=1
DynamicVariables=1

[MeterMandala3]
Meter=Shape
X=200
Y=([#TaskbarHeight# - 40] / 2)
Shape=Ellipse 20,20,20 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color #ColorBorder#
LeftMouseUpAction=["cmd.exe"]
DynamicVariables=1

[MeterMandala3Text]
Meter=String
X=220
Y=([#TaskbarHeight#] / 2)
FontFace=#FontMandala#
FontSize=14
FontColor=#ColorGlow#
StringAlign=CenterCenter
Text=⚙
AntiAlias=1
DynamicVariables=1

[MeterMandala4]
Meter=Shape
X=260
Y=([#TaskbarHeight# - 40] / 2)
Shape=Ellipse 20,20,20 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color #ColorBorder#
LeftMouseUpAction=["control.exe"]
DynamicVariables=1

[MeterMandala4Text]
Meter=String
X=280
Y=([#TaskbarHeight#] / 2)
FontFace=#FontMandala#
FontSize=14
FontColor=#ColorGlow#
StringAlign=CenterCenter
Text=⚡
AntiAlias=1
DynamicVariables=1

; ─── SYSTEM TRAY AREA (Right side) ───
[MeterClock]
Meter=String
MeasureName=MeasureTime
X=(#SCREENAREAWIDTH# - 20)
Y=(#TaskbarHeight# / 2)
FontFace=#FontUI#
FontSize=10
FontColor=#ColorText#
StringAlign=RightCenter
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterCpu]
Meter=String
X=(#SCREENAREAWIDTH# - 120)
Y=(#TaskbarHeight# / 2)
FontFace=#FontLabel#
FontSize=8
FontColor=#ColorTextDim#
StringAlign=RightCenter
AntiAlias=1
Text=CPU
DynamicVariables=1

[MeasureCPU]
Measure=CPU
Processor=0
UpdateDivider=2

[MeterCpuVal]
Meter=String
MeasureName=MeasureCPU
X=(#SCREENAREAWIDTH# - 130)
Y=(#TaskbarHeight# / 2)
FontFace=#FontUI#
FontSize=10
FontColor=#ColorText#
StringAlign=RightCenter
AntiAlias=1
Text=%1%
DynamicVariables=1
