<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #000000; }
      .horn { fill: #8a0303; }
      .halo { fill: #d4af37; opacity: 0.9; }
      .snarky { fill: #ffffff; font-family: 'Impact', sans-serif; font-size: 26px; text-anchor: middle; line-height: 1.4; letter-spacing: 0.5px; }
      .small { font-size: 20px; opacity: 0.9; }
    ]]></style>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>
  <!-- Horn (top) -->
  <path class="horn" d="M250,50 Q200,-100 300,50 T400,150 L420,170 Q380,100 300,0 Z"/>
  <!-- Halo (bottom) -->
  <path class="halo" d="M250,350 A200,200 0 0,1 50,350 A200,200 0 0,1 250,350 Z"/>
  <!-- Dark humor text -->
  <text class="snarky" x="250" y="150">GOOD EVIL</text>
  <text class="snarky small" x="250" y="180">BETTER THAN</text>
  <text class="snarky" x="250" y="210">PURE GOOD</text>
  <text class="snarky" x="250" y="250">HALO IS OVERATED</text>
  <text class="snarky" x="250" y="280">HORNS GET THINGS DONE</text>
</svg>