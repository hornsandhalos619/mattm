<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .horn { fill: #8a0303; }
      .halo { fill: #d4af37; opacity: 0.8; }
      .text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 48px; text-anchor: middle; }
    ]]></style>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000"/>
  <!-- Left Horn -->
  <path class="horn" d="M200,600 Q150,300 250,200 T350,100 L370,120 Q330,200 280,300 Z"/>
  <!-- Right Halo -->
  <path class="halo" d="M550,400 A150,150 0 0,1 850,400 A150,150 0 0,1 550,400 Z"/>
  <!-- Text -->
  <text class="text" x="400" y="500">Horns & Halos</text>
</svg>