<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA|
      .sticker-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .horn { fill: #8a0303; }
      .halo { fill: #d4af37; opacity: 0.9; }
      .text { fill: #000000; font-family: Arial, sans-serif; text-anchor: middle; }
      .title { font-size: 24px; font-weight: bold; }
      .subtitle { font-size: 18px; }
    ]]></style>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  
  <!-- Sticker 1 -->
  <g transform="translate(150,150)">
    <circle class="sticker-bg" cx="0" cy="0" r="100"/>
    <!-- Horns -->
    <path class="horn" d="M-30,50 Q-40,0 0,-30 T30,50 Z"/>
    <!-- Halo -->
    <path class="halo" d="M0,-70 A30,30 0 0,1 30,-10 A30,30 0 0,1 0,50 A30,30 0 0,1 -30,-10 A30,30 0 0,1 0,-70 Z"/>
    <text class="text title" x="0" y="20">Stay Horny</text>
    <text class="text subtitle" x="0" y="50">Wear Your Darkness</text>
  </g>
  
  <!-- Sticker 2 -->
  <g transform="translate(450,150)">
    <circle class="sticker-bg" cx="0" cy="0" r="100"/>
    <!-- Skull simple -->
    <circle cx="0" cy="-10" r="30" fill="#222222"/>
    <rect x="-15" y="10" width="30" height="20" fill="#222222"/>
    <circle cx="-10" cy="-20" r="5" fill="#ffffff"/>
    <circle cx="10" cy="-20" r="5" fill="#ffffff"/>
    <path d="M-15,10 Q0,20 15,10" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text class="text title" x="0" y="40">Dark Side</text>
    <text class="text subtitle" x="0" y="60">of the Street</text>
  </g>
  
  <!-- Sticker 3 -->
  <g transform="translate(750,150)">
    <circle class="sticker-bg" cx="0" cy="0" r="100"/>
    <!-- Angel wing + devil wing -->
    <path d="M-40,0 Q-60,-40 -20,-20 Q0,0 20,-20 Q40,-40 20,0" stroke="#8a0303" stroke-width="3" fill="none"/>
    <path d="M-20,-20 Q0,-40 20,-20" stroke="#d4af37" stroke-width="3" fill="none"/>
    <text class="text title" x="0" y="30">Angelic</text>
    <text class="text subtitle" x="0" y="50">Devilry</text>
  </g>
  
  <!-- Sticker 4 -->
  <g transform="translate(1050,150)">
    <circle class="sticker-bg" cx="0" cy="0" r="100"/>
    <!-- Pitchfork -->
    <path d="M0,-40 L0,20 M-15,20 L-30,0 L-15,-20 M0,20 L15,0 L0,-20" stroke="#8a0303" stroke-width="3" fill="none"/>
    <text class="text title" x="0" y="-50">Sinfully</text>
    <text class="text subtitle" x="0" y="-30">Styled</text>
  </g>
  
  <!-- Sticker 5 -->
  <g transform="translate(150,450)">
    <circle class="sticker-bg" cx="0" cy="0" r="100"/>
    <!-- Flames -->
    <path d="M-10,0 Q0,-20 10,0 Q5,10 0,0 Q-5,10 -10,0 Z" fill="#8a0303"/>
    <path d="M-5,0 Q0,-15 5,0 Q3,5 0,0 Q-3,5 -5,0 Z" fill="#d4af37"/>
    <text class="text title" x="0" y="30">Wicked</text>
    <text class="text subtitle" x="0" y="50">Threads</text>
  </g>
  
  <!-- Sticker 6 -->
  <g transform="translate(450,450)">
    <circle class="sticker-bg" cx="0" cy="0" r="100"/>
    <!-- Tribal horn/halo combo -->
    <path class="horn" d="M-25,50 Q-30,0 0,-40 T25,50 Z"/>
    <path class="halo" d="M0,-20 A20,20 0 0,1 20,0 A20,20 0 0,1 0,20 A20,20 0 0,1 -20,0 A20,20 0 0,1 0,-20 Z"/>
    <text class="text title" x="0" y="60">Horns &</text>
    <text class="text title" x="0" y="80">Halos</text>
  </g>
</svg>