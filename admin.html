<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — Oakwood Residences</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ==================== LOGIN VIEW ==================== -->
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="login-logo">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
        <path d="M16 2L4 12v16h10V20h4v8h10V12L16 2z" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
      </svg>
      <span>Oakwood</span>
    </div>
    <h1>Admin Portal</h1>
    <p class="login-sub">Sign in to manage listings, pricing, and site-wide content.</p>
    <div class="login-error" id="loginError"></div>
    <div class="login-field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="admin">
    </div>
    <div class="login-field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <a href="index.html" class="login-back">&larr; Back to website</a>
  </div>
</div>

<!-- ==================== DASHBOARD VIEW ==================== -->
<div id="dashView" class="dash-view hidden">
  <aside class="sidebar">
    <div class="side-brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <path d="M16 2L4 12v16h10V20h4v8h10V12L16 2z" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
      </svg>
      <div>
        <strong>Oakwood</strong>
        <span>Admin Portal</span>
      </div>
    </div>
    <nav class="side-nav">
      <button class="side-tab active" data-tab="listings" onclick="switchTab('listings')">
        <span class="tab-ico">&#9638;</span> Floor Plan Listings
      </button>
      <button class="side-tab" data-tab="settings" onclick="switchTab('settings')">
        <span class="tab-ico">&#9881;</span> Site-Wide Settings
      </button>
    </nav>
    <div class="side-footer">
      <a href="index.html" target="_blank" class="side-link">&#8599; View Website</a>
      <button class="side-logout" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h2 id="pageTitle">Floor Plan Listings</h2>
      <div class="topbar-right">
        <span class="admin-badge">Signed in as <strong>admin</strong></span>
      </div>
    </div>

    <!-- ========== LISTINGS PANEL ========== -->
    <section id="panelListings" class="panel">
      <div class="panel-toolbar">
        <span id="listingCount" class="count-pill"></span>
        <button class="btn-accent" onclick="openEditor(null)">+ Add New Listing</button>
      </div>
      <div id="listingsList" class="listings-list"></div>
    </section>

    <!-- ========== SETTINGS PANEL ========== -->
    <section id="panelSettings" class="panel hidden">
      <div class="settings-card">
        <h3>Browser Tab &amp; Hero</h3>
        <div class="s-row">
          <label for="set_siteTitle">Page Title (browser tab)</label>
          <input type="text" id="set_siteTitle">
        </div>
        <div class="s-row">
          <label for="set_heroBadge">Hero Badge</label>
          <input type="text" id="set_heroBadge">
        </div>
        <div class="s-grid2">
          <div class="s-row">
            <label for="set_heroHeading">Hero Heading</label>
            <input type="text" id="set_heroHeading">
          </div>
          <div class="s-row">
            <label for="set_heroHighlight">Hero Highlight (gold text)</label>
            <input type="text" id="set_heroHighlight">
          </div>
        </div>
        <div class="s-row">
          <label for="set_heroSubheading">Hero Subheading</label>
          <textarea id="set_heroSubheading" rows="3"></textarea>
        </div>
      </div>

      <div class="settings-card">
        <h3>Announcement Banner</h3>
        <label class="switch-row">
          <input type="checkbox" id="set_announcementEnabled">
          <span>Show a site-wide announcement bar under the navigation</span>
        </label>
        <div class="s-row">
          <label for="set_announcementText">Banner text</label>
          <input type="text" id="set_announcementText" placeholder="e.g. Limited-time offer: first month free on all 2-bedroom leases!">
        </div>
      </div>

      <div class="settings-card">
        <h3>Contact &amp; Footer</h3>
        <div class="s-grid2">
          <div class="s-row">
            <label for="set_contactPhone">Phone</label>
            <input type="text" id="set_contactPhone">
          </div>
          <div class="s-row">
            <label for="set_contactEmail">Email</label>
            <input type="text" id="set_contactEmail">
          </div>
        </div>
        <div class="s-row">
          <label for="set_contactAddress">Sales Gallery Address</label>
          <input type="text" id="set_contactAddress">
        </div>
        <div class="s-grid2">
          <div class="s-row">
            <label for="set_contactHours">Office Hours</label>
            <input type="text" id="set_contactHours">
          </div>
          <div class="s-row">
            <label for="set_footerTagline">Footer Tagline</label>
            <input type="text" id="set_footerTagline">
          </div>
        </div>
      </div>

      <div class="settings-actions">
        <button class="btn-accent btn-lg" onclick="saveSettingsForm()">Save Site Settings</button>
        <button class="btn-danger" onclick="resetAllData()">Reset All Data to Defaults</button>
      </div>
    </section>
  </main>
</div>

<!-- ==================== LISTING EDITOR MODAL ==================== -->
<div class="editor-overlay" id="editorModal">
  <div class="editor-modal">
    <div class="editor-head">
      <h3 id="editorTitle">Edit Listing</h3>
      <button class="modal-x" onclick="closeEditor()">&times;</button>
    </div>
    <div class="editor-body">
      <div class="e-grid2">
        <div class="s-row">
          <label for="fName">Listing Name *</label>
          <input type="text" id="fName" placeholder="The Two Bedroom">
        </div>
        <div class="s-row">
          <label for="fPrice">Monthly Price *</label>
          <input type="text" id="fPrice" placeholder="$3,350">
        </div>
      </div>
      <div class="e-grid3">
        <div class="s-row">
          <label for="fBeds">Beds</label>
          <input type="text" id="fBeds" placeholder="2 Beds">
        </div>
        <div class="s-row">
          <label for="fBaths">Baths</label>
          <input type="text" id="fBaths" placeholder="2 Baths">
        </div>
        <div class="s-row">
          <label for="fSqft">Square Feet</label>
          <input type="text" id="fSqft" placeholder="1,100 sqft">
        </div>
      </div>
      <div class="s-row">
        <label for="fTheme">Card Theme</label>
        <select id="fTheme"></select>
      </div>
      <div class="s-row">
        <label for="fDesc">Description</label>
        <textarea id="fDesc" rows="3" placeholder="Short marketing description shown in the detail view..."></textarea>
      </div>
      <h4>Feature Grid (detail modal)</h4>
      <div class="e-grid3">
        <div class="s-row"><label for="fFeatHeight">Max Height</label><input type="text" id="fFeatHeight"></div>
        <div class="s-row"><label for="fFeatWindow">Window</label><input type="text" id="fFeatWindow"></div>
        <div class="s-row"><label for="fFeatBalcony">Balcony</label><input type="text" id="fFeatBalcony"></div>
      </div>
      <div class="e-grid2">
        <div class="s-row"><label for="fFeatLaundry">Laundry</label><input type="text" id="fFeatLaundry"></div>
        <div class="s-row"><label for="fFeatParking">Parking</label><input type="text" id="fFeatParking"></div>
      </div>
    </div>
    <div class="editor-foot">
      <button class="btn-ghost" onclick="closeEditor()">Cancel</button>
      <button class="btn-accent" onclick="saveListing()">Save Listing</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
