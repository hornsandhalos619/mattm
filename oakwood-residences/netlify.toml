[build]
  publish = "."

# Static assets - no SPA redirect, serve directly
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback ONLY for paths without dots (no extension)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  port = 3000
  autoLaunch = true