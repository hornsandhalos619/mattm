<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oakwood Residences - Admin Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 2L4 12v16h10V20h4v8h10V12L16 2z" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
        </svg>
        <span>Oakwood Residences</span>
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <!-- Error message area -->
        <div id="loginError" class="error-box" role="alert"></div>

        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" name="username" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary w-full">
          Sign In
        </button>
      </form>

      <div class="links">
        <p>Demo credentials:</p>
        <p style="margin: 8px 0 0; font-family: monospace; color: var(--terra);">
          Username: <strong>admin</strong>
          <br>Password: <strong>Password12!</strong>
        </p>
        <a href="admin.html" class="btn btn-secondary" style="margin-top: 20px; width: auto;">Continue to Admin Portal</a>
      </div>
    </div>
  </div>

  <script>
    // Credentials matching the admin portal
    const DEMO_USERNAME = 'admin';
    const DEMO_PASSWORD = 'Password12!';

    function showError(message) {
      const errorBox = document.getElementById('loginError');
      errorBox.textContent = message;
      errorBox.classList.add('visible');
      setTimeout(() => errorBox.classList.remove('visible'), 5000);
    }

    function hideError() {
      const errorBox = document.getElementById('loginError');
      errorBox.classList.remove('visible');
    }

    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      // Clear previous errors
      hideError();

      if (username === DEMO_USERNAME && password === DEMO_PASSWORD) {
        // Set the same auth key the admin portal expects
        sessionStorage.setItem('oakwood_admin_authed', '1');
        // Redirect to admin dashboard
        window.location.href = 'admin.html';
      } else {
        showError('Invalid username or password. Use: admin / Password12!');
        // Clear password field
        document.getElementById('loginPassword').value = '';
      }
    }
  </script>
</body>
</html>
